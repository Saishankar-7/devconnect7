<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Primary Meta ── -->
  <title>DevConnect — Employee Referral & Professional Networking Platform</title>
  <meta name="description"
    content="DevConnect bridges the gap between students, job seekers, and industry professionals. Discover mentors, request employee referrals, and accelerate your tech career." />
  <meta name="keywords"
    content="job referral, tech jobs, software engineer referral, professional networking, DevConnect, tech careers, student referral" />
  <meta name="author" content="DevConnect" />
  <meta name="theme-color" content="#172554" />

  <!-- ── Favicon & App Icons ── -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23172554'/%3E%3Cstop offset='50%25' stop-color='%233B82F6'/%3E%3Cstop offset='100%25' stop-color='%237C3AED'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='10' fill='url(%23g)'/%3E%3Cpath d='M12 28V12L20 20L28 12V28' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='20' cy='28' r='2.5' fill='white'/%3E%3C/svg%3E" />

  <!-- ── Open Graph (LinkedIn, Facebook, WhatsApp) ── -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://devconnect.app/" />
  <meta property="og:title" content="DevConnect — Your Next Opportunity Starts With a Connection" />
  <meta property="og:description"
    content="DevConnect bridges the gap between students, job seekers, and tech professionals. Find verified referrers, request referrals, and land your dream tech job." />
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="DevConnect" />

  <!-- ── Twitter / X Card ── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://devconnect.app/" />
  <meta name="twitter:title" content="DevConnect — Your Next Opportunity Starts With a Connection" />
  <meta name="twitter:description"
    content="DevConnect bridges the gap between students, job seekers, and tech professionals. Find verified referrers, request referrals, and land your dream tech job." />
  <meta name="twitter:image" content="/og-image.png" />

  <!-- ── Fonts: Inter & Plus Jakarta Sans ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />

  <!-- ── Critical inline styles: prevent flash of unstyled content ── -->
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary: #F8FAFC;
      --accent: #3B82F6;
      color-scheme: light;
    }

    html,
    body {
      height: 100%;
      background-color: #F8FAFC;
      color: #0F172A;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    #root {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ── Splash loader shown before React hydrates ── */
    #splash {
      position: fixed;
      inset: 0;
      background: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 9999;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .splash-logo-mark {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #172554 0%, #3B82F6 55%, #7C3AED 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }

    .splash-logo-mark svg {
      width: 22px;
      height: 22px;
      stroke: #ffffff;
      fill: none;
    }

    .splash-logo-text {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #0F172A;
    }

    .splash-logo-text span {
      background: linear-gradient(135deg, #3B82F6 0%, #7C3AED 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .splash-ring {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(59, 130, 246, 0.15);
      border-top-color: #3B82F6;
      border-radius: 50%;
      animation: splashSpin 0.75s linear infinite;
      margin-top: 4px;
    }

    @keyframes splashSpin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }

    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    /* ── Selection highlight ── */
    ::selection {
      background: rgba(59, 130, 246, 0.15);
      color: #0F172A;
    }

    ::-moz-selection {
      background: rgba(59, 130, 246, 0.15);
      color: #0F172A;
    }

    /* ── Focus ring ── */
    :focus-visible {
      outline: 2px solid #3B82F6;
      outline-offset: 2px;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <!-- Splash screen — hidden once React mounts -->
  <div id="splash" aria-hidden="true">
    <div class="splash-brand">
      <div class="splash-logo-mark">
        <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 18V6l8 8 8-8v12" />
          <circle cx="12" cy="18" r="2" fill="white" />
        </svg>
      </div>
      <div class="splash-logo-text">Dev<span>Connect</span></div>
    </div>
    <div class="splash-ring"></div>
  </div>

  <div id="root"></div>

  <!-- Hide splash as soon as the page finishes loading -->
  <script>
    window.addEventListener('load', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        setTimeout(function () {
          splash.classList.add('hidden');
          setTimeout(function () { splash.remove(); }, 400);
        }, 300);
      }
    });
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
